name: Forky G — Monthly Content Cycle

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client name'
        required: true
        default: 'la_medusa'
        type: choice
        options:
          - la_medusa
          - scholeia
          - studies_quebec
          - bimpro
          - la_bruja
          - el_kapricho
      month:
        description: 'Month (e.g. junio_2026)'
        required: true
        default: 'junio_2026'
  schedule:
    - cron: '0 14 1 * *'

jobs:
  run-content-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Install brand fonts
        run: |
          sudo apt-get install -y --fix-missing fontconfig wget unzip || true
          mkdir -p /usr/share/fonts/forky

          # Download fonts directly from GitHub mirrors (more reliable than Google Fonts API)
          BASE="https://raw.githubusercontent.com/google/fonts/main/ofl"

          wget -q "$BASE/marcellus/Marcellus-Regular.ttf" -O /usr/share/fonts/forky/Marcellus-Regular.ttf || true
          wget -q "$BASE/librebaskerville/LibreBaskerville-Regular.ttf" -O /usr/share/fonts/forky/LibreBaskerville-Regular.ttf || true
          wget -q "$BASE/librebaskerville/LibreBaskerville-Bold.ttf" -O /usr/share/fonts/forky/LibreBaskerville-Bold.ttf || true

          fc-cache -f /usr/share/fonts/forky 2>/dev/null || true
          echo "Fonts installed: $(ls /usr/share/fonts/forky/ 2>/dev/null | wc -l) files"

      - name: Install Python dependencies
        run: pip install requests Pillow

      - name: Configure rclone
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf

      - name: Build clip index (Claude Vision analyzes client media)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd src
          python clip_indexer.py --client "${{ github.event.inputs.client || 'la_medusa' }}" || true

      - name: Run Forky-G content cycle
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          GDRIVE_FOLDER_ID:   ${{ secrets.GDRIVE_FOLDER_ID }}
          FONT_DIR:           /usr/share/fonts/forky
        run: |
          cd src
          python forky_g.py \
            --client "${{ github.event.inputs.client || 'la_medusa' }}" \
            --month  "${{ github.event.inputs.month  || 'junio_2026' }}"
          echo "Output files:"
          find output -type f | sort

      - name: Upload to Google Drive
        if: always()
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          CLIENT="${{ github.event.inputs.client || 'la_medusa' }}"
          MONTH="${{ github.event.inputs.month || 'junio_2026' }}"
          CLIENT_DISPLAY=$(echo "$CLIENT" | sed 's/_/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)}1')
          OUTPUT_DIR="src/output/$CLIENT/$MONTH"
          if [ -d "$OUTPUT_DIR" ] && [ "$(ls -A $OUTPUT_DIR 2>/dev/null)" ]; then
            echo "Uploading $OUTPUT_DIR to Drive..."
            rclone copy "$OUTPUT_DIR" \
              "gdrive:/$CLIENT_DISPLAY/$MONTH/" \
              --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
              --transfers 4 \
              --progress
            echo "✅ Upload complete"
          else
            echo "No output files to upload"
          fi

      - name: Upload output artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forky-g-${{ github.event.inputs.client || 'la_medusa' }}-${{ github.run_id }}
          path: src/output/
          retention-days: 30

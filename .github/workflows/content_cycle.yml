name: Forky G — Monthly Content Cycle

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client name'
        required: true
        default: 'la_medusa'
        type: choice
        options:
          - la_medusa
          - scholeia
          - studies_quebec
          - bimpro
          - la_bruja
          - el_kapricho
      month:
        description: 'Month (e.g. junio_2026)'
        required: true
        default: 'junio_2026'
  schedule:
    # Runs on the 1st of every month at 9am EST
    - cron: '0 14 1 * *'

jobs:
  run-content-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Forky G content cycle
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          GDRIVE_FOLDER_ID:   ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          cd src
          python forky_g.py \
            --client "${{ github.event.inputs.client || 'la_medusa' }}" \
            --month  "${{ github.event.inputs.month  || 'julio_2026' }}"

      - name: Upload to Google Drive
        if: always()
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          CLIENT="${{ github.event.inputs.client || 'la_medusa' }}"
          MONTH="${{ github.event.inputs.month || 'julio_2026' }}"
          FOLDER_ID="${{ secrets.GDRIVE_FOLDER_ID }}"
          # Convert client name to display name
          CLIENT_DISPLAY=$(echo "$CLIENT" | sed 's/_/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)}1')
          rclone copy "output/$CLIENT/$MONTH/" \
            "gdrive:/$CLIENT_DISPLAY/$MONTH/" \
            --drive-root-folder-id "$FOLDER_ID" \
            --progress || true

      - name: Upload output artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forky-g-output-${{ github.run_id }}
          path: output/
          retention-days: 30
